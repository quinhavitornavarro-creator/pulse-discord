services:
  - type: web
    name: pulse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lucasvitor-db
          property: connectionString
      - key: TURN_URL
        value: ""
      - key: TURN_USERNAME
        value: ""
      - key: TURN_CREDENTIAL
        value: ""
